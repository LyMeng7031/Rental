version: "3.9"

services:
  app:
    build: .
    container_name: rental-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db # optional if using local Postgres for testing

  # Optional: local Postgres for testing/development
  db:
    image: postgres:15
    container_name: rental-db
    environment:
      POSTGRES_DB: rental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
